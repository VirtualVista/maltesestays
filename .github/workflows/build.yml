name: Build and publish maltesestays.com

on:
  schedule:
    - cron: "17 4 * * *"      # every day at 04:17 UTC: picks up new or removed Boom listings
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate site from Boom
        run: python3 build.py
      - name: Save Boom snapshot (so changes are visible in the repo history)
        run: |
          git config user.name "stay-bot"
          git config user.email "bot@landlord.care"
          git add data/boom-snapshot.json || true
          git diff --cached --quiet || git commit -m "Boom snapshot $(date -u +%F)" && git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
